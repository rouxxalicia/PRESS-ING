<style>
/* Accès par code */
html:not(.unlocked) body > *:not(#gate) { visibility: hidden; }
html.unlocked #gate { display: none; }
#gate { position: fixed; inset: 0; z-index: 100; visibility: visible; display: flex; align-items: center; justify-content: center; padding: 24px 16px; background: var(--bg); color: var(--fg); font-family: var(--font); }
#gate form { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 14px; text-align: center; }
#gate .g-brand { font-size: 28px; letter-spacing: 0.18em; font-weight: 600; margin: 0 0 6px; }
#gate .g-label { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
#gate input { font: inherit; font-size: 16px; padding: 14px 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); text-align: center; border-radius: 0; }
#gate input:focus { outline: none; border-color: var(--fg); }
#gate button { font: inherit; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; padding: 15px; border: 0; background: var(--invert-bg); color: var(--invert-fg); cursor: pointer; }
#gate .g-field { position: relative; display: flex; }
#gate .g-field input { flex: 1; min-width: 0; padding-inline: 48px; }
#gate .g-eye { position: absolute; right: 0; top: 0; bottom: 0; width: 48px; padding: 0; display: flex; align-items: center; justify-content: center; background: none; color: var(--muted); letter-spacing: 0; }
#gate .g-eye:hover, #gate .g-eye[aria-pressed="true"] { color: var(--fg); }
#gate .g-eye[aria-pressed="true"] .g-slash { display: none; }
#gate .g-err { min-height: 1.2em; font-size: 13px; color: var(--muted); margin: 0; }
/* Boutique de mode épurée : noir et blanc, petites capitales espacées, colonnes étroites et beaucoup d'air */
:root {
  --bg: #ffffff;
  --fg: #111110;
  --muted: #6b6966;
  --line: #e7e5e2;
  --soft: #f5f4f2;
  --invert-bg: #111110; --invert-fg: #ffffff;
  --m-esh: #111110; --m-esh-fg: #ffffff;
  --m-anglais: #e9e6e1; --m-anglais-fg: #111110;
  --m-espagnol: #d6d1c9; --m-espagnol-fg: #111110;
  --m-allemand: #f3f2ef; --m-allemand-fg: #111110;
  --font: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --title: var(--font);
  --serif: var(--font);
  --c-esh: #3550c7; --c-anglais: #6b1424; --c-espagnol: #a5781c; --c-allemand: #6d3fb8;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c0c0b; --fg: #f2f1ef; --muted: #a29f9a; --line: #2a2927; --soft: #171716;
  --invert-bg: #f2f1ef; --invert-fg: #0c0c0b;
  --m-esh: #f2f1ef; --m-esh-fg: #0c0c0b;
  --m-anglais: #252422; --m-anglais-fg: #f2f1ef;
  --m-espagnol: #34322f; --m-espagnol-fg: #f2f1ef;
  --m-allemand: #1b1a19; --m-allemand-fg: #f2f1ef;
  --c-esh: #8197ff; --c-anglais: #8e1f35; --c-espagnol: #e0b452; --c-allemand: #b18cf2;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0c0c0b; --fg: #f2f1ef; --muted: #a29f9a; --line: #2a2927; --soft: #171716;
  --invert-bg: #f2f1ef; --invert-fg: #0c0c0b;
  --m-esh: #f2f1ef; --m-esh-fg: #0c0c0b;
  --m-anglais: #252422; --m-anglais-fg: #f2f1ef;
  --m-espagnol: #34322f; --m-espagnol-fg: #f2f1ef;
  --m-allemand: #1b1a19; --m-allemand-fg: #f2f1ef;
  --c-esh: #8197ff; --c-anglais: #8e1f35; --c-espagnol: #e0b452; --c-allemand: #b18cf2;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 1px solid var(--fg); outline-offset: 3px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.narrow { max-width: 740px; margin: 0 auto; }
.label { font-size: 10.5px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; }
.muted { color: var(--muted); }

/* En-tête */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding-block: 16px; }
.brand { grid-column: 2; font-stretch: 125%; font-weight: 600; font-size: 17px; letter-spacing: 0.08em; line-height: 1; }
.top-nav { display: none; gap: 24px; }
.top-nav a { color: var(--muted); padding-block: 4px; }
.top-nav a[aria-current="page"] { color: var(--fg); }
.top-date { justify-self: end; }
.top-right { justify-self: end; display: flex; align-items: center; gap: 10px; }
.top-icon { width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); border-radius: 99px; transition: color 0.15s, background 0.15s; }
.top-icon:hover { color: var(--fg); background: var(--soft); }
.top-edit { border: 1px solid var(--fg); border-radius: 99px; padding: 6px 12px; }
.top-edit.on { background: var(--fg); color: var(--bg); }
.read-prog { position: fixed; left: 0; top: 0; height: 2px; width: 0; background: var(--accent, var(--fg)); z-index: 35; pointer-events: none; transition: width 0.08s linear; }

nav.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bg); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.bottom a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; padding-block: 10px 11px; color: var(--muted); font-size: 9.5px; }
nav.bottom a svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
nav.bottom a[aria-current="page"] { color: var(--fg); }
main { padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
/* Recherche rapide globale */
.qs-bg { position: fixed; inset: 0; z-index: 60; background: rgba(17,17,16,.38); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display: flex; align-items: flex-start; justify-content: center; padding: max(56px, 10vh) 16px 24px; }
.qs-box { width: 100%; max-width: 560px; background: var(--bg); border: 1px solid var(--fg); display: flex; flex-direction: column; max-height: 76vh; overflow: hidden; }
.qs-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.qs-head input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg); font: inherit; font-size: 16px; outline: none; }
.qs-head input::placeholder { color: var(--muted); }
.qs-list { overflow-y: auto; padding: 6px 16px 14px; }
.qs-grp { padding: 14px 0 6px; color: var(--muted); }
.qs-item { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; width: 100%; text-align: left; padding: 10px 0; border-bottom: 1px solid var(--line); }
.qs-item:last-child { border-bottom: 0; }
.qs-item .t { font-size: 15px; font-weight: 500; }
.qs-item:hover .t { text-decoration: underline; text-underline-offset: 3px; }
.qs-item .sub { font-size: 13px; color: var(--muted); }

/* Accueil : choix de la matière au centre */
.home { min-height: calc(100svh - 140px); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 28px; padding-block: 40px; }
.home h1 { margin: 0; font-size: clamp(22px, 4.6vw, 30px); font-weight: 400; letter-spacing: -0.01em; text-wrap: balance; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 460px; }
.choice { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 26px 12px; border: 1px solid var(--line); transition: background 0.25s, color 0.25s, border-color 0.25s; }
.choice .name { font-size: 13px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; }
.choice:hover, .choice:focus-visible { background: var(--invert-bg); color: var(--invert-fg); border-color: var(--invert-bg); }
.choice:hover .muted, .choice:focus-visible .muted { color: inherit; opacity: 0.7; }
.home-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 20px; }
.home-links a { color: var(--muted); border-bottom: 1px solid transparent; }
.home-links a:hover { color: var(--fg); border-bottom-color: var(--fg); }

/* Édition façon magazine */
.ed-jump { position: sticky; }
.ed-head { padding-block: 32px 20px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.ed-stats { display: flex; flex-wrap: wrap; gap: 8px 26px; align-items: center; }
.ed-jump { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-left: auto; }
.ed-jump a { display: inline-flex; align-items: center; gap: 7px; color: var(--fg); border: 1px solid var(--line); padding: 8px 12px; }
.ed-jump a:hover { border-color: var(--fg); }
.ed-jump a:hover { color: var(--fg); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot.big { width: 11px; height: 11px; }
.dot { display: none; }
.num { color: var(--muted); }
.mag { padding-block: 56px 8px; }
.mag + .mag { margin-top: 24px; }
.mag-head { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
.mag-head h2 { margin: 0; font-stretch: 125%; font-weight: 600; font-size: clamp(22px, 4.4vw, 30px); letter-spacing: 0.02em; text-transform: uppercase; line-height: 1; }
.mag-head { padding-bottom: 14px; border-bottom: 1px solid var(--fg); }
.mag-rule { visibility: hidden; }
.mag-rule { flex: 1; height: 1px; background: var(--line); min-width: 20px; }
.mag-grid { display: grid; gap: 28px; }
.num { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; }
.mag-grid { margin-top: 22px; }
.lead, .small { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.lead { padding: 26px 24px 24px; background: var(--soft); gap: 12px; }
.lead:hover { background: var(--line); }
.lead h3 { margin: 0; font-weight: 500; font-size: clamp(21px, 3.6vw, 27px); line-height: 1.22; letter-spacing: -0.015em; text-wrap: balance; }
.chapo { margin: 0; font-size: 15px; line-height: 1.6; color: var(--muted); max-width: 75ch; }
.side { display: grid; gap: 0; }
.small { padding-block: 18px 22px; border-top: 1px solid var(--line); }
.small h3 { margin: 0; font-weight: 500; font-size: 16.5px; line-height: 1.35; text-wrap: balance; }
.lead:hover h3, .small:hover h3 { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
/* Photos */
.ph { position: relative; overflow: hidden; background: var(--soft); margin: 0; }
.ph img { display: block; width: 100%; height: 100%; object-fit: cover; }
.lead .ph { aspect-ratio: 16 / 10; margin: -26px -24px 6px; }
.small.has-img { display: grid; grid-template-columns: minmax(0, 1fr) 96px; column-gap: 16px; align-items: start; }
.small.has-img .ph { grid-column: 2; grid-row: 1 / span 3; aspect-ratio: 1; }
.small.has-img > :not(.ph) { grid-column: 1; }
.row .ph { aspect-ratio: 4 / 5; }
.hero { aspect-ratio: 16 / 9; }
/* Photo d'article : fondu progressif vers le fond de la page */
.card .hero { aspect-ratio: 4 / 3; background: transparent; margin-bottom: -48px; }
.card .hero img { -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 50%, rgba(0,0,0,.85) 64%, rgba(0,0,0,.45) 80%, transparent 100%); mask-image: linear-gradient(to bottom, #000 0%, #000 50%, rgba(0,0,0,.85) 64%, rgba(0,0,0,.45) 80%, transparent 100%); animation: hero-in .7s ease both; }
.card .hero + .credit { position: relative; margin-top: 0; }
@keyframes hero-in { from { opacity: 0; transform: scale(1.03); } to { opacity: 1; transform: none; } }
@media (max-width: 772px) { .card .hero { margin-inline: -16px; } }
@media (min-width: 773px) { .card .hero { aspect-ratio: 16 / 9; } }
@media (prefers-reduced-motion: reduce) { .card .hero img { animation: none; } }
.credit { font-size: 11.5px; color: var(--muted); margin-top: -10px; }
.credit a { text-decoration: underline; text-underline-offset: 2px; }
@media (min-width: 820px) {
  .mag-grid { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 48px; }
  .side { align-content: start; }
  .small:first-child { padding-top: 4px; border-top: 0; }
}

/* À lire */
.prop { padding-block: 56px 24px; }
.prop-txt { margin: 14px 0 18px; max-width: 560px; font-size: 15px; line-height: 1.5; }
.prop-list { margin-top: 26px; display: flex; flex-direction: column; }
.prop-item { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); font-size: 15px; }
.prop-item a { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.prop-item .more { margin-left: auto; }
.seg.prop-mats { display: flex; flex-wrap: wrap; align-self: stretch; }
.alire { padding-block: 64px 8px; }
.alire-grid { display: grid; gap: 36px; margin-top: 22px; }
.alire-col h3 { margin: 0 0 4px; font-stretch: 125%; font-weight: 600; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; }
.alire-item { display: flex; flex-direction: column; gap: 5px; padding-block: 16px; border-top: 1px solid var(--line); }
.alire-item .t { font-size: 16px; font-weight: 500; line-height: 1.35; text-wrap: balance; }
.alire-item:hover .t { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.alire-item .p { color: var(--muted); font-size: 14px; line-height: 1.5; }
@media (min-width: 820px) { .alire-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 48px; } }

/* Liste d'une matière */
.subtabs { display: flex; gap: 20px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); margin-top: 8px; }
.subtabs::-webkit-scrollbar { display: none; }
.subtabs a { padding-block: 12px; color: var(--muted); white-space: nowrap; border-bottom: 1px solid transparent; margin-bottom: -1px; }
.subtabs a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--fg); }
.page-head { display: flex; flex-direction: column; gap: 6px; padding-block: 32px 20px; }
.page-head h1 { margin: 0; font-size: clamp(22px, 4.4vw, 28px); font-weight: 500; letter-spacing: -0.01em; }
.row { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 16px; padding-block: 20px; border-top: 1px solid var(--line); align-items: start; }
.row:last-child { border-bottom: 1px solid var(--line); }
.thumb { aspect-ratio: 4 / 5; max-width: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 7px; }
.thumb .n { font-size: 9px; letter-spacing: 0.12em; }
.thumb .m { font-stretch: 70%; font-weight: 700; font-size: 15px; text-transform: uppercase; line-height: 0.9; }
[data-m="esh"] { background: var(--m-esh); color: var(--m-esh-fg); }
[data-m="anglais"] { background: var(--m-anglais); color: var(--m-anglais-fg); }
[data-m="espagnol"] { background: var(--m-espagnol); color: var(--m-espagnol-fg); }
[data-m="allemand"] { background: var(--m-allemand); color: var(--m-allemand-fg); }
.row-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.row h2 { margin: 0; font-size: 16.5px; font-weight: 500; line-height: 1.35; text-wrap: balance; }
.row p { margin: 0; color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row:hover h2 { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.lue { color: var(--muted); }
.group-title { padding-block: 32px 4px; }

/* Article */
.back { display: inline-flex; padding-block: 18px 6px; color: var(--muted); }
.back:hover { color: var(--fg); }
article.card { padding-block: 16px 24px; display: flex; flex-direction: column; gap: 18px; }
.band { height: 4px; }
.card h1 { margin: 0; font-size: clamp(23px, 4.6vw, 32px); font-weight: 500; line-height: 1.2; letter-spacing: -0.015em; text-wrap: balance; }
.seg { display: inline-grid; grid-template-columns: repeat(2, auto); align-self: flex-start; border: 1px solid var(--fg); }
.seg button { padding: 10px 16px; }
.seg button[aria-pressed="true"] { background: var(--invert-bg); color: var(--invert-fg); }
.sec { display: flex; flex-direction: column; gap: 10px; padding-top: 22px; border-top: 1px solid var(--line); }
.sec h2 { margin: 0; }
.prose p { margin: 0; font-size: 16px; line-height: 1.75; max-width: none; }
.prose p + p { margin-top: 12px; }
.vocab { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 16px; }
.vocab div { padding-block: 9px; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.vocab div:nth-child(odd) { font-weight: 600; }
.vocab div:nth-child(even) { color: var(--muted); }
.notion { display: flex; flex-direction: column; gap: 3px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.notion:last-child { border-bottom: 0; }
.notion .t { font-weight: 600; font-size: 14.5px; text-align: left; }
button.t { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.notion-btn { display: inline-flex; align-items: baseline; gap: 8px; flex-wrap: wrap; align-self: flex-start; color: var(--fg); }
.notion-btn:hover { color: var(--accent); }
.notion-go { color: var(--accent); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; text-decoration: none; display: inline-block; }
.notion span { color: var(--muted); font-size: 14.5px; }
.sujets { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.sujets li { display: grid; grid-template-columns: 28px minmax(0, 1fr); font-size: 15px; }
.sujets li b { font-weight: 600; font-variant-numeric: tabular-nums; }
.source a { text-decoration: underline; text-underline-offset: 3px; }
.bar { position: sticky; bottom: calc(53px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--line); display: flex; gap: 8px; padding-block: 10px; margin-top: 8px; }
.fav-btn { width: 48px; height: 48px; flex-shrink: 0; border: 1px solid var(--fg); display: flex; align-items: center; justify-content: center; }
.fav-btn[aria-pressed="true"] svg { fill: currentColor; }
.anki-btn { height: 48px; flex-shrink: 0; padding-inline: 16px; border: 1px solid var(--fg); display: flex; align-items: center; justify-content: center; }
.next-btn { flex-grow: 1; height: 48px; background: var(--invert-bg); color: var(--invert-fg); display: flex; align-items: center; justify-content: center; }

.auteur { display: flex; flex-direction: column; gap: 8px; padding-block: 6px 14px; }
.auteur + .auteur { border-top: 1px solid var(--line); padding-top: 16px; }
.auteur h3 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.35; }
.auteur h3 em { font-weight: 400; }
.more { align-self: flex-start; color: var(--muted); border-bottom: 1px solid currentColor; padding-bottom: 2px; }
.more:hover { color: var(--fg); }

/* Référentiel */
.search { width: 100%; height: 46px; border: 0; border-bottom: 1px solid var(--fg); background: transparent; color: var(--fg); padding: 0; font: inherit; font-size: 16px; border-radius: 0; }

.list-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-block: 16px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }

.btn:hover { background: var(--invert-bg); color: var(--invert-fg); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(130px + env(safe-area-inset-bottom, 0px)); background: var(--invert-bg); color: var(--invert-fg); padding: 11px 18px; z-index: 40; }

/* Référentiel : carrousel de cartes en verre */
.hub { position: relative; min-height: calc(100svh - 140px); display: flex; flex-direction: column; justify-content: center; gap: 26px; padding-block: 36px 28px; overflow: hidden; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); }
.hub-bg { position: absolute; inset: 0; pointer-events: none; }
.hub-bg i { position: absolute; border-radius: 50%; filter: blur(50px); }
.hub-bg i:nth-child(1) { width: 52vmax; height: 52vmax; left: -16vmax; top: -10vmax; background: radial-gradient(circle at 40% 40%, rgba(120,116,110,.45), transparent 68%); animation: drift 18s ease-in-out infinite alternate; }
.hub-bg i:nth-child(2) { width: 44vmax; height: 44vmax; right: -16vmax; bottom: -14vmax; background: radial-gradient(circle, rgba(210,204,195,.8), transparent 68%); animation: drift 22s ease-in-out infinite alternate-reverse; }
.hub-bg i:nth-child(3) { width: 30vmax; height: 30vmax; left: 40%; top: 34%; background: radial-gradient(circle, rgba(90,88,84,.3), transparent 70%); animation: drift 26s ease-in-out infinite alternate; }
@keyframes drift { to { transform: translate(5vmax, 4vmax) scale(1.1); } }
.hub-head { position: relative; text-align: center; display: flex; flex-direction: column; gap: 8px; padding-inline: 16px; }
.hub-head h1 { margin: 0; font-size: clamp(24px, 5vw, 34px); font-weight: 400; letter-spacing: -0.01em; }
.rail { position: relative; display: flex; gap: 18px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 20px calc(50% - min(36vw, 150px)); -webkit-overflow-scrolling: touch; }
.rail::-webkit-scrollbar { display: none; }
.glass { --mx: 30%; --my: 20%; --sx: 50%; position: relative; flex: 0 0 min(72vw, 300px); aspect-ratio: 3 / 4.6; scroll-snap-align: center; display: flex; flex-direction: column; gap: 10px; padding: 26px 24px 22px; border-radius: 34px; overflow: hidden; isolation: isolate;
  background: linear-gradient(160deg, rgba(255,255,255,.62), rgba(255,255,255,.16) 55%, rgba(255,255,255,.3));
  -webkit-backdrop-filter: blur(30px) saturate(190%) brightness(1.06); backdrop-filter: blur(30px) saturate(190%) brightness(1.06);
  border: 1px solid rgba(255,255,255,.75);
  box-shadow: inset 0 1.5px 0 rgba(255,255,255,.95), inset 0 -1px 0 rgba(255,255,255,.35), inset 1px 0 0 rgba(255,255,255,.4), inset -1px 0 0 rgba(255,255,255,.25), 0 30px 60px -28px rgba(20,20,18,.4), 0 8px 20px -12px rgba(20,20,18,.2);
  transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .45s; will-change: transform; }
.glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1; pointer-events: none;
  background: radial-gradient(120% 60% at var(--sx) -10%, rgba(255,255,255,.75), rgba(255,255,255,0) 55%), linear-gradient(200deg, rgba(255,255,255,0) 60%, rgba(255,255,255,.35)); }
.glass::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; padding: 1px;
  background: linear-gradient(140deg, rgba(255,255,255,.95), rgba(255,255,255,.1) 40%, rgba(255,255,255,.05) 60%, rgba(255,255,255,.7));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.g-sheen { position: absolute; inset: 0; border-radius: inherit; z-index: -1; pointer-events: none; background: radial-gradient(40% 30% at var(--mx) var(--my), rgba(255,255,255,.55), transparent 70%); opacity: 0; transition: opacity .3s; }
.glass:hover .g-sheen { opacity: 1; }
.g-k { color: var(--accent); }
.g-s { color: var(--muted); margin-top: auto; }
.g-t { font-stretch: 125%; font-weight: 600; font-size: clamp(34px, 9vw, 44px); letter-spacing: 0.01em; text-transform: uppercase; line-height: .95; color: var(--accent); }
.g-d { color: var(--fg); opacity: .72; font-size: 14.5px; line-height: 1.5; }

.rail-dots { position: relative; display: flex; justify-content: center; gap: 8px; }
.rail-dots button { width: 7px; height: 7px; border-radius: 99px; background: rgba(17,17,16,.2); transition: width .3s, background .3s; }
.rail-dots button[aria-current="true"] { width: 24px; background: var(--fg); }
:root[data-theme="dark"] .glass { background: linear-gradient(160deg, rgba(255,255,255,.16), rgba(255,255,255,.04) 55%, rgba(255,255,255,.08)); border-color: rgba(255,255,255,.2); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.3), 0 30px 60px -28px rgba(0,0,0,.8); }
:root[data-theme="dark"] .glass::before { background: radial-gradient(120% 60% at var(--sx) -10%, rgba(255,255,255,.18), transparent 55%); }
:root[data-theme="dark"] .hub-bg i { opacity: .55; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .glass { background: linear-gradient(160deg, rgba(255,255,255,.16), rgba(255,255,255,.04) 55%, rgba(255,255,255,.08)); border-color: rgba(255,255,255,.2); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.3), 0 30px 60px -28px rgba(0,0,0,.8); }
  :root:not([data-theme="light"]) .glass::before { background: radial-gradient(120% 60% at var(--sx) -10%, rgba(255,255,255,.18), transparent 55%); }
  :root:not([data-theme="light"]) .hub-bg i { opacity: .55; } }
@media (min-width: 720px) { .glass { flex-basis: 300px; } .rail { padding-inline: calc(50% - 150px); gap: 28px; } }
@media (prefers-reduced-motion: reduce) { .hub-bg i { animation: none; } .glass { transition: none; } }

/* Culture générale */

.cg-dossier { margin-top: 12px; }

@media (min-width: 820px) { .cg-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 48px; } }
@media (max-width: 520px) { .enjeu-row { grid-template-columns: minmax(0, 1fr); gap: 2px; } }

/* Bordeaux */

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --accent: #8e1f35; --accent-soft: #2a1519; --accent-fg: #0c0c0b; } }
.brand, #gate .g-brand { color: var(--accent); }
.top-nav a[aria-current="page"], nav.bottom a[aria-current="page"] { color: var(--accent); }
.mag-head h2, .cg-head h1, .g-t { color: var(--accent); }

.oeuvre { margin: 0 0 4px; display: flex; flex-direction: column; gap: 8px; }

.sec.supprime { opacity: .6; }
.edit-bar button.ed-del:hover { color: var(--accent); }
.edit-bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 10px; }
.edit-bar button { color: var(--muted); border-bottom: 1px solid currentColor; padding-bottom: 1px; }
.edit-bar button:hover, .edit-bar .ed-ok { color: var(--accent); }
.sec.editing .sec-body { outline: 1px dashed var(--fg); outline-offset: 8px; border-radius: 4px; }
.sec-body { display: flex; flex-direction: column; gap: 10px; }

/* Leçons : cartes mentales — fond blanc, police du site, codes couleur des leçons du Drive */
.vm-viewport, .cm-legend, .fs-on {
  --paper: #ffffff; --ink: #1a1a1a; --ink-2: #555;
  --date: #38761d;   /* dates : gras vert foncé 2 */
  --auth: #ec5c07;   /* auteurs gras, œuvres italique */
  --num: #1155cc;    /* chiffres : gras bleu bleuet foncé 1 */
  --h2: #6aa84f;     /* titres niv. 2 : vert foncé 1 */
  --h3: #1c4587;     /* titres niv. 3 : bleu bleuet foncé 2 */
  --ex: #d9ead3;     /* encadrés exemple : vert clair */
  --key: #cfe2f3;    /* phrases-clés : surligné bleu clair */
  --wire: #b9b9b9;
  --db-y: #38761d; --db-n: #6b1424; --db-m: #674ea7;
  --f-map: "Archivo", "Helvetica Neue", Arial, sans-serif;
}
.vu-cours { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); opacity: .55; margin-left: 7px; vertical-align: 3px; }
.lec-list { display: grid; grid-template-columns: minmax(0,1fr); border-top: 1px solid var(--fg); }
.lec { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 16px; padding-block: 18px; border-bottom: 1px solid var(--line); }
.lec .no { grid-column: 1 / -1; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.lec .ti { font-size: 17px; font-weight: 500; line-height: 1.3; }
.lec .nb { color: var(--muted); font-size: 13px; align-self: end; white-space: nowrap; }
.lec:hover .ti { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.cm-stage { display: flex; flex-direction: column; gap: 12px; min-width: 0; margin-top: 8px; }
.cm-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.cm-picker { display: flex; flex-wrap: wrap; gap: 6px; }
.cm-chip, .cm-btn { border: 1px solid var(--line); border-radius: 99px; background: none; color: var(--muted); font: 500 10px var(--font); letter-spacing: .14em; text-transform: uppercase; padding: 8px 12px; cursor: pointer; white-space: nowrap; }
.cm-chip:hover, .cm-btn:hover { border-color: var(--fg); color: var(--fg); }
.cm-chip[aria-pressed="true"], .cm-btn[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.cm-btn { color: var(--fg); border-color: var(--fg); }
.cm-chip.cm-deb { border-style: dashed; }
.cm-where { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: .06em; margin: 0 4px; }
.cm-bar .sp { flex: 1; }
.cm-hint { font-size: 13px; color: var(--muted); margin: 0; max-width: 72ch; }
.cm-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; font-size: 12.5px; color: var(--muted); }
.cm-legend .key { background: var(--key); color: #1a1a1a; padding: 1px 6px; border-radius: 3px; }
.vm-viewport { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; overflow: auto; max-width: 100%; max-height: 82vh; }
.vm-sizer { position: relative; }
.vm-canvas { position: relative; transform-origin: 0 0; background: var(--paper); color: var(--ink); font-family: var(--f-map); font-stretch: 92%; font-size: 15px; line-height: 1.32; -webkit-font-smoothing: antialiased; }
.vm-box { position: absolute; left: 0; top: 0; }
.vm-center { text-align: center; max-width: 340px; padding: 14px 20px 16px; border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink); background: var(--paper); }
.vm-center small { display: block; font-size: 10px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 8px; }
.vm-center span { font-weight: 700; font-size: 27px; line-height: 1.1; display: block; text-wrap: balance; letter-spacing: -.005em; }
/* codes couleur des leçons */
.vm-canvas .a, .cm-legend .a { color: var(--auth); font-weight: 700; }
.vm-canvas .w, .cm-legend .w { color: var(--auth); font-style: italic; }
.vm-canvas .d, .cm-legend .d { color: var(--date); font-weight: 700; white-space: nowrap; }
.vm-canvas .n, .cm-legend .n { color: var(--num); font-weight: 700; white-space: nowrap; }
.vm-canvas .e, .cm-legend .e { background: var(--ex); color: #1a1a1a; padding: 1px 5px; border-radius: 3px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }

<script>
(function () {
  var HASH = "6e43ca820a388641ccbe433feaf19aa0e382e66e5a4acd9b4762d7ee6f747309"; /* empreinte du code d'accès : demande à Claude pour le changer */
  var KEY = "pressing-acces";
  function ok() { document.documentElement.classList.add("unlocked"); }

  function sha(t) { return crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)).then(function (b) { return Array.from(new Uint8Array(b)).map(function (x) { return x.toString(16).padStart(2, "0"); }).join(""); }); }

    e.preventDefault();
    sha(i.value.trim().toLowerCase()).then(function (h) {

  <a href="#referentiel" data-nav="referentiel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.6h9.6a2.4 2.4 0 0 1 2.4 2.4v12.4H7.4A2.4 2.4 0 0 1 5 17V4.6z"/><path d="M8.6 9h5.4M8.6 12.4h5.4"/><path d="M17 7h2v12.4H7.4"/></svg>Référentiel</a>
  <a href="#archives" data-nav="archives"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.2"/><path d="M12 7.5v4.8l3 1.8"/></svg>Archives</a>
  <a href="#favoris" data-nav="favoris"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.5h12v15l-6-4-6 4z"/></svg>Favoris</a>
</nav>

<script>
(function () {
  const MATS = ["esh", "anglais", "espagnol", "allemand"];
  const NOM = { esh: "ESH", anglais: "Anglais", espagnol: "Espagnol", allemand: "Allemand", tout: "Tout" };
  const VO_HEAD = {anglais: ["What happened", "Why it matters"], espagnol: ["Qué ha pasado", "Por qué importa"], allemand: ["Was passiert ist", "Warum es wichtig ist"]};
  const VO_LABEL = { anglais: "English", espagnol: "Español", allemand: "Deutsch" };
  const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  const JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
  const state = { index: [], editions: {}, ref: null, date: null, lang: {}, view: "accueil", fromCarte: null };
  const app = document.getElementById("app");

  function load(k, f) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch (e) { return f; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  let favs = load("pressing:favs", {});
  let demandes = load("pressing:demandes", []), traites = [];
  let dossiers = load("pressing:dossiers", []), favsMaj = load("pressing:favsMaj", 0);
  function saveFavs(msg) { favsMaj = Date.now(); save("pressing:favs", favs); save("pressing:dossiers", dossiers); save("pressing:favsMaj", favsMaj); if (EDIT()) persist(msg || "Favoris"); }
  let lues = load("pressing:lues", {});
  // Modifications partagées : enregistrées dans data/modifs.json sur GitHub, visibles par tous
  let notes = {}, caches = {}, edits = {}, ajouts = { refs: [], fiches: {} }, notesPub = false;
  const GH = { repo: "rouxxalicia/PRESS-ING", path: "pressing/data/modifs.json" };
  const EDIT = () => !!load("pressing:gh", null);
  function b64(str) { const b = new TextEncoder().encode(str); let out = ""; for (let i = 0; i < b.length; i += 0x8000) out += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(out); }
  let ghT, ghBusy = false, ghAgain = false;
  function persist(msg) {
    save("pressing:copie", { notes, caches, edits, ajouts });
    if (!EDIT()) return;
    clearTimeout(ghT); ghT = setTimeout(() => ghPush(msg), 1500);
  }
  async function ghPush(msg) {
    if (ghBusy) { ghAgain = true; return; }
    ghBusy = true;
    const tok = load("pressing:gh", ""), url = "https://api.github.com/repos/" + GH.repo + "/contents/" + GH.path;
    const H = { Authorization: "Bearer " + tok, Accept: "application/vnd.github+json" };
    try {
      for (let essai = 0; essai < 2; essai++) {
        const g = await fetch(url + "?ref=main&t=" + Date.now(), { headers: H, cache: "no-store" });
        const sha = g.ok ? (await g.json()).sha : undefined;
        const r = await fetch(url, { method: "PUT", headers: H, body: JSON.stringify({ message: msg || "Modifications d'Alicia", content: b64(JSON.stringify({ notes, notesPub, caches, edits, ajouts, favs, dossiers, favsMaj, demandes }, null, 1)), sha: sha, branch: "main" }) });
        if (r.ok) { toast("Publié · visible par tous d'ici quelques minutes"); break; }
        if (r.status === 401 || r.status === 403) { toast("Clé GitHub refusée : vérifie-la dans Mes notes"); break; }
        if (essai === 1) toast("Publication impossible, réessaie");
      }
    } catch (e) { toast("Pas de connexion : modification gardée sur cet appareil"); }
    ghBusy = false; if (ghAgain) { ghAgain = false; ghPush(msg); }
  }
  async function loadModifs() {
    try { traites = (await getJSON("data/demandes-traitees.json?t=" + Date.now())).ids || []; } catch (e) { traites = []; }
    try { const m = await getJSON("data/modifs.json?t=" + Date.now()); if (EDIT() && m.demandes) { const par = {}; m.demandes.concat(demandes).forEach(d => { const x = par[d.id]; par[d.id] = x ? Object.assign({}, x, d, { annule: x.annule || d.annule }) : d; }); demandes = Object.values(par).sort((a, b) => (a.date || "").localeCompare(b.date || "")); save("pressing:demandes", demandes); } notesPub = !!m.notesPub; notes = (EDIT() || notesPub) ? (m.notes || {}) : {}; caches = m.caches || {}; edits = m.edits || {}; ajouts = m.ajouts || ajouts; if (EDIT() && (m.favsMaj || 0) > favsMaj) { const anciens = favsMaj ? {} : favs; favs = Object.assign({}, anciens, m.favs || {}); dossiers = m.dossiers || []; favsMaj = m.favsMaj; save("pressing:favs", favs); save("pressing:dossiers", dossiers); save("pressing:favsMaj", favsMaj); if (Object.keys(anciens).some(k => !(m.favs || {})[k])) saveFavs("Favoris : fusionne un appareil"); } else if (EDIT() && !favsMaj && Object.keys(favs).length) saveFavs("Favoris : premier envoi"); } catch (e) {}
    if (EDIT()) { const c = load("pressing:copie", null); if (c) { notes = Object.assign({}, notes, c.notes); caches = Object.assign({}, caches, c.caches); edits = Object.assign({}, edits, c.edits); if (c.ajouts) ajouts = { refs: ajouts.refs.concat((c.ajouts.refs || []).filter(x => !ajouts.refs.some(y => y.id === x.id))), fiches: Object.assign({}, ajouts.fiches, c.ajouts.fiches) }; } }
  }
  function supprBtn(k) { if (!editOn()) return ""; return '<div class="ref-suppr"><button type="button" class="label more" data-cacher="' + esc(k) + '">Supprimer cette référence</button></div>'; }
  function notesBox(key, titre) {
    if (!EDIT()) { const n = notes[key]; return n && n.texte ? '<section class="sec mes-notes"><h2 class="label">Notes d\'Alicia</h2><div class="prose"><p style="white-space:pre-line">' + esc(n.texte) + '</p></div></section>' : ""; }
    return '<section class="sec mes-notes"><h2 class="label">Mes notes</h2><textarea class="note-area" data-note="' + esc(key) + '" data-titre="' + esc(titre) + '" placeholder="Écris ici tes idées, citations, exemples, liens avec ton cours…" rows="5">' + esc((notes[key] || {}).texte || "") + '</textarea><span class="label muted note-etat" aria-live="polite">' + (notes[key] ? "Publié" : "Publié automatiquement") + '</span></section>';
  }

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function fmt(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>"); }
  function pd(d) { const [y, m, j] = d.split("-").map(Number); return new Date(y, m - 1, j); }
  function dLong(d) { const x = pd(d); return JOURS[x.getDay()] + " " + x.getDate() + " " + MOIS[x.getMonth()] + " " + x.getFullYear(); }
  function dShort(d) { const x = pd(d); return String(x.getDate()).padStart(2, "0") + "." + String(x.getMonth() + 1).padStart(2, "0") + "." + String(x.getFullYear()).slice(2); }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function firstSentence(t) { const m = t.match(/^.*?[.!?](\s|$)/); return m ? m[0] : t; }
  function toast(msg) { const t = document.createElement("div"); t.className = "toast label"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 1800); }
  const BOOKMARK = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>';

  async function getJSON(p) { const r = await fetch(p, { cache: "no-cache" }); if (!r.ok) throw new Error(p); return r.json(); }
  async function edition(d) { if (!state.editions[d]) state.editions[d] = await getJSON("data/editions/" + d + ".json"); return state.editions[d]; }
  async function cgData(src) {
    if (src === "peaknews") {
      if (!state.cgPeakBase) state.cgPeakBase = await getJSON("data/cg/peaknews.json");
      const b = state.cgPeakBase;
      return Object.assign({}, b, { refs: b.refs.slice(), fiches: Object.assign({}, b.fiches, ajouts.fiches || {}) });
    }
    if (!state.cgBase) state.cgBase = await getJSON("data/cg/humanite.json");
    const b = state.cgBase, refs = b.refs.slice();
    (ajouts.refs || []).forEach(a => { const i = refs.findIndex(x => x.id === a.id); if (i >= 0) refs[i] = Object.assign({}, refs[i], a); else { const j = refs.map(x => x.rub).lastIndexOf(a.rub); refs.splice(j + 1, 0, a); } });
    return Object.assign({}, b, { refs: refs, fiches: Object.assign({}, b.fiches, ajouts.fiches || {}) });
  }
  async function referentiel() { if (!state.ref) state.ref = await getJSON("data/referentiel.json"); return state.ref; }

  function photo(c, cls) { const i = c.image; if (!i || !/^https:\/\//.test(i.url || "")) return ""; return '<figure class="ph' + (cls ? " " + cls : "") + '"><img src="' + esc(i.url) + '" alt="' + esc(i.alt || "") + '" loading="lazy" referrerpolicy="no-referrer" onerror="this.closest(\'figure\').remove()"></figure>'; }
  function thumb(c, n) { if (c.image && c.image.url) return photo(c); return '<div class="thumb" data-m="' + c.matiere + '" aria-hidden="true"><span class="n">N°' + String(n).padStart(2, "0") + '</span><span class="m">' + NOM[c.matiere] + '</span></div>'; }
  function row(c, n) {
    return '<a class="row" href="#' + c.id + '">' + thumb(c, n) +
      '<div class="row-body"><span class="label muted">' + esc(c.source) + ' · ' + c.minutes + ' min' + (lues[c.id] ? ' · <span class="lue">Lue</span>' : '') + '</span>' +
      '<h2>' + esc(c.titre) + '</h2><p>' + esc(firstSentence(c.faits)) + '</p></div></a>';
  }
  function setNav() {
    const sec = state.view === "fiche" ? "referentiel" : (state.view === "cg" || state.view === "refhub" ? "referentiel" : (["referentiel", "archives", "favoris", "nonlues"].includes(state.view) ? state.view : "accueil"));
    document.querySelectorAll("[data-nav]").forEach(a => a.dataset.nav === sec ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
    document.getElementById("top-date").textContent = state.date ? dShort(state.date) : "";
  }
  function latestNote() {
    return state.date === state.index[0] ? "" : '<p class="label muted" style="margin:16px 0 0">Édition du ' + dLong(state.date) + ' · <a href="#accueil" data-latest style="text-decoration:underline">Revenir à aujourd\'hui</a></p>';
  }

  // Accueil : la une
  async function viewAccueil() {
    const ed = await edition(state.date);
    const mats = MATS.filter(m => ed.cards.some(c => c.matiere === m));
    const minutes = ed.cards.reduce((s, c) => s + (c.minutes || 0), 0);
    const x = pd(state.date), num = state.index.length - state.index.indexOf(state.date);
    const une = ed.cards[0], u = tt(une);
    let h = latestNote();
    h += '<div class="une-head"><div><span class="label muted">Édition n° ' + num + '</span><h1 class="une-date">' + cap(JOURS[x.getDay()]) + '<br>' + x.getDate() + ' ' + MOIS[x.getMonth()] + '</h1></div>' +
      '<div class="une-stats label muted"><span><b>' + ed.cards.length + '</b> actualités</span><span><b>' + minutes + '</b> minutes de lecture</span><a href="#nonlues" data-nl-link></a></div></div>';
    h += '<a class="une" href="#' + une.id + '">' + photo(une, "une-ph") + '<div class="une-txt"><span class="label acc">À la une · ' + esc(NOM[une.matiere]) + '</span><h2>' + esc(u.titre) + '</h2>' +
      '<p class="chapo">' + fmt(firstSentence(une.faits || "")) + '</p><span class="label muted">' + esc(une.source) + (u.tag ? ' · ' + esc(u.tag) : '') + (lues[une.id] ? ' · Lue' : '') + '</span></div></a>';
    const aL = (ed.a_lire || []).some(a => a && /^https:\/\//.test(a.url || ""));
    h += '<nav class="une-tabs" aria-label="Matières">' + mats.map(m => '<button type="button" data-goto="sec-' + m + '">' + NOM[m] + '</button>').join("") + (aL ? '<button type="button" data-goto="sec-alire">À lire</button>' : '') + '</nav>';
    let k = 0;
    mats.forEach(m => {
      const tous = ed.cards.filter(c => c.matiere === m), cs = tous.filter(c => !c.culture && c !== une), cult = tous.filter(c => c.culture);
      h += '<section class="mag2" id="sec-' + m + '"><div class="mag2-head"><h2><a href="#' + m + '">' + NOM[m] + '</a></h2><span class="label muted">' + tous.length + ' actualité' + (tous.length > 1 ? 's' : '') + (cult.length ? ' dont culture' : '') + '</span></div>';
      if (cs.length) { const lay = k++ % 3; h += lay === 0 || cs.length < 3 ? gGrid(cs) : gSplit(cs, lay === 2); }
      cult.forEach(c => { h += gCulture(c); });
      h += '</section>';
    });
    h += aLire(ed) + proposer();
    app.innerHTML = h;
    updateNL(); syncTabs();
  }
  const enAttente = () => demandes.filter(d => !d.annule && !traites.includes(d.id));
  function proposer() {
    const att = enAttente();
    return '<section class="prop2"><p class="muted">Un article à ajouter ? <button type="button" class="lnk" data-prop-new>Proposer un lien</button></p>' +

      (att.length ? '<div class="prop-list"><span class="label muted">En attente · ' + att.length + '</span>' + att.map(d => { let h = d.url; try { h = new URL(d.url).hostname.replace(/^www\./, ""); } catch (e) {}
        return '<div class="prop-item"><span class="label">' + esc(NOM[d.matiere] || d.matiere) + '</span><a href="' + esc(d.url) + '" target="_blank" rel="noopener">' + esc(h) + '</a>' + (d.texte ? '<span class="muted">· texte collé</span>' : '') + '<button type="button" class="more label" data-prop-del="' + esc(d.id) + '">Annuler</button></div>'; }).join("") + '</div>' : '') + '</section>';
  }
  function devineMat(u) { let h = ""; try { h = new URL(u).hostname; } catch (e) {} if (/\.(es|mx|ar|co|cl)$|elpais|elmundo|lavanguardia|eldiario|clarin|rtve|efe\./.test(h)) return "espagnol"; if (/\.(de|at|ch)$|dw\.com/.test(h)) return "allemand"; if (/\.(uk)$|bbc|guardian|ft\.com|economist|nytimes|washingtonpost|wsj|bloomberg|politico|npr|cnn|axios|theatlantic|reuters|apnews/.test(h)) return "anglais"; return "esh"; }
  function propSheet() {
    if (!EDIT()) { toast("Active d'abord le mode éditrice (clé GitHub dans Mes notes)"); return; }
    fdClose(); const w = document.createElement("div"); w.className = "fd-sheet-bg";
    w.innerHTML = '<div class="fd-sheet" role="dialog" aria-label="Proposer un article"><span class="label muted">Proposer un article</span>' +
      '<input class="search" type="url" placeholder="Colle le lien de l\'article" data-prop-url>' +
      '<div class="seg label prop-mats" role="group" aria-label="Matière">' + MATS.map(m => '<button type="button" data-prop-mat="' + m + '" aria-pressed="' + (m === "esh") + '">' + NOM[m] + '</button>').join("") + '</div>' +
      '<textarea class="note-area" rows="5" placeholder="Seulement si l\'article est payant (Les Échos, Le Monde…) : colle ici son texte" data-prop-texte></textarea>' +
      '<button type="button" class="btn label fd-ok" data-prop-ok>Ajouter à la file</button></div>';
    document.body.appendChild(w); w.addEventListener("click", e => { if (e.target === w) fdClose(); });
    const u = w.querySelector("[data-prop-url]"); u.focus();
    u.addEventListener("input", () => { if (w.dataset.matChoisie) return; const m = devineMat(u.value); w.querySelectorAll("[data-prop-mat]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.propMat === m))); });
  }
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-prop-new],[data-prop-mat],[data-prop-ok],[data-prop-del]"); if (!t) return;
    if (t.hasAttribute("data-prop-new")) propSheet();
    else if (t.dataset.propMat) { const w = t.closest(".fd-sheet-bg"); w.dataset.matChoisie = 1; w.querySelectorAll("[data-prop-mat]").forEach(b => b.setAttribute("aria-pressed", String(b === t))); }
    else if (t.hasAttribute("data-prop-ok")) { const w = t.closest(".fd-sheet"), url = w.querySelector("[data-prop-url]").value.trim(), texte = w.querySelector("[data-prop-texte]").value.trim(), mb = w.querySelector('[data-prop-mat][aria-pressed="true"]');
      if (!/^https?:\/\/\S+\.\S+/.test(url)) { toast("Colle un lien qui commence par https://"); return; }
      if (demandes.some(d => d.url === url && !d.annule)) { toast("Cet article est déjà dans la file"); return; }
      demandes.push(Object.assign({ id: "d" + Date.now().toString(36), url, matiere: mb ? mb.dataset.propMat : "esh", date: new Date().toISOString() }, texte ? { texte } : {}));
      save("pressing:demandes", demandes); persist("Propose un article"); fdClose(); toast("Ajouté : il sera dans la prochaine édition"); if (state.view === "accueil") viewAccueil(); }
    else if (t.dataset.propDel) { const d = demandes.find(x => x.id === t.dataset.propDel); if (d) d.annule = true; save("pressing:demandes", demandes); persist("Annule une proposition d'article"); toast("Proposition annulée"); viewAccueil(); }
  });
  function aLire(ed) {
    const l = (ed.a_lire || []).filter(a => a && /^https:\/\//.test(a.url || ""));
    if (!l.length) return "";
    const js = [...new Set(l.map(a => a.journal))];
    return '<section class="alire2" id="sec-alire"><div class="mag2-head"><h2>À lire</h2><span class="label muted">' + js.map(esc).join(" · ") + '</span></div><ol class="alire2-list">' +
      l.map((a, i) => '<li><a href="' + esc(a.url) + '" target="_blank" rel="noopener"><span class="n">' + String(i + 1).padStart(2, "0") + '</span><span class="b"><span class="label muted">' + esc(a.journal) + '</span><span class="t">' + esc(a.titre) + '</span>' +
        (a.pourquoi ? '<span class="p">' + fmt(a.pourquoi) + '</span>' : '') + '</span></a></li>').join("") + '</ol></section>';
  }

  // Liste
  async function viewMatiere(m) {
    const ed = await edition(state.date);
    const all = ed.cards.map((c, i) => Object.assign({ n: i + 1 }, c));
    let html = latestNote() + '<nav class="subtabs label narrow" aria-label="Matières">' + ["tout"].concat(MATS).map(x => '<a href="#' + x + '"' + (x === m ? ' aria-current="page"' : '') + '>' + NOM[x] + '</a>').join("") + '</nav>';
    html += '<div class="narrow"><div class="page-head"><span class="label muted">' + cap(dLong(state.date)) + '</span><h1>' + (m === "tout" ? "L'édition complète" : NOM[m]) + '</h1></div>';
    if (m === "tout") {
      html += MATS.map(x => { const cs = all.filter(c => c.matiere === x); return cs.length ? '<h2 class="label group-title">' + NOM[x] + '</h2><div>' + cs.map(c => row(c, c.n)).join("") + '</div>' : ""; }).join("");
    } else {
      const cs = all.filter(c => c.matiere === m);
      html += cs.length ? '<div>' + cs.map(c => row(c, c.n)).join("") + '</div>' : '<div class="empty"><p>Pas d\'actu dans cette matière pour cette édition.</p></div>';
    }
    app.innerHTML = html + '</div>';
  }

  // Article
  async function viewCarte(id) {
    const d = id.slice(0, 10);
    const ed = await edition(d);
    const idx = ed.cards.findIndex(c => c.id === id);
    if (idx < 0) { app.innerHTML = '<div class="empty narrow"><p>Cette actu est introuvable.</p><a class="btn label" href="#accueil">Voir l\'édition</a></div>'; return; }
    const c = ed.cards[idx];
    const ref = c.notions && c.notions.length ? await referentiel().catch(() => null) : null;
    lues[id] = 1; save("pressing:lues", lues);
    const lang = state.lang[id] || (c.vo ? "vo" : "fr");
    const t = lang === "vo" && c.vo ? c.vo : c;
    const L = lang === "vo" && c.vo ? ({ anglais: "en", espagnol: "es", allemand: "de" })[c.matiere] || "fr" : "fr";
    const same = ed.cards.filter(x => x.matiere === c.matiere);
    const pos = same.findIndex(x => x.id === id);
    const next = same[pos + 1] || ed.cards[(idx + 1) % ed.cards.length];
    let h = '<div class="narrow"><a class="back label" href="#' + c.matiere + '">← ' + NOM[c.matiere] + '</a>';
    h += '<article class="card">' + (c.image && c.image.url ? photo(c, "hero") + (c.image.credit ? '<p class="credit">Photo · ' + (c.image.source ? '<a href="' + esc(c.image.source) + '" target="_blank" rel="noopener">' + esc(c.image.credit) + '</a>' : esc(c.image.credit)) + '</p>' : '') : '<div class="band" data-m="' + c.matiere + '"></div>');
    h += '<span class="label muted">' + NOM[c.matiere] + (c.culture ? ' · Culture' : '') + ' · ' + (pos + 1) + ' / ' + same.length + ' · ' + esc(c.source) + ' · ' + c.minutes + ' min</span>';
    h += '<h1>' + esc(t.titre) + '</h1>';
    if (c.vo) h += '<div class="seg label" role="group" aria-label="Langue du texte"><button type="button" data-lang="fr" aria-pressed="' + (lang === "fr") + '">Français</button><button type="button" data-lang="vo" aria-pressed="' + (lang === "vo") + '">' + VO_LABEL[c.matiere] + ' · C1</button></div>';
    h += '<section class="sec"><h2 class="label">' + (lang === "vo" ? VO_HEAD[c.matiere][0] : "Ce qui s'est passé") + '</h2><div class="prose" lang="' + L + '" translate="no"><p>' + fmt(t.faits) + '</p></div></section>';

  // Mes notes
  function viewNotes(parts) {
    const back = '<a class="back label" href="#referentiel">← Référentiel</a>';
    if (parts[0] === "n" && !EDIT()) { location.hash = "notes"; return; }
    if (parts[0] === "n") {
      const k = parts[1] || "perso:" + Date.now().toString(36);
      const n = notes[k] || { titre: "", texte: "" };
      app.innerHTML = '<div class="narrow"><a class="back label" href="#notes">← Mes notes</a><article class="card"><span class="label muted">Note libre</span>' +
        '<input class="note-titre" id="note-titre" placeholder="Titre" value="' + esc(n.titre) + '">' +
        '<textarea class="note-area big" data-note="' + esc(k) + '" placeholder="Écris ce que tu veux : une idée de plan, une accroche, un argument, une référence trouvée…" rows="14">' + esc(n.texte) + '</textarea>' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><span class="label muted note-etat" aria-live="polite">' + (notes[k] ? "Enregistré" : "") + '</span>' + (notes[k] ? '<button type="button" class="label more" data-suppr="' + esc(k) + '">Supprimer</button>' : '') + '</div></article></div>';
      const t = document.getElementById("note-titre"), a = app.querySelector(".note-area");
      t.addEventListener("input", () => { a.dataset.titre = t.value; a.dispatchEvent(new Event("input", { bubbles: true })); });
      a.dataset.titre = n.titre; if (!parts[1]) history.replaceState(null, "", "#notes/n/" + encodeURIComponent(k));
      a.focus(); return;
    }
    const ks = Object.keys(notes).sort((x, y) => (notes[y].maj || 0) - (notes[x].maj || 0));
    const lien = k => k.startsWith("perso:") ? "#notes/n/" + encodeURIComponent(k) : k.startsWith("esh:") ? "#" + k.slice(4) : k.startsWith("cgp:") ? "#cg-peaknews/f/" + k.slice(4) : k.startsWith("cg:") ? "#cg/f/" + k.slice(3) : k.startsWith("dossierp:") ? "#cg-peaknews/e/" + k.slice(9) : "#cg/e/" + k.slice(8);
    const type = k => k.startsWith("perso:") ? "Note libre" : k.startsWith("esh:") ? "Fiche ESH" : k.startsWith("cgp:") ? "Culture G. · PeakNews" : k.startsWith("cg:") ? "Fiche Culture G." : "Dossier";
    let h = '<div class="narrow">' + back + '<div class="page-head"><span class="label muted">' + (EDIT() ? 'Mode éditrice' : 'Lecture') + '</span><h1>' + (EDIT() ? 'Mes notes' : 'Notes d\'Alicia') + '</h1><p class="muted" style="margin:4px 0 0">' + (EDIT() ? 'Tes notes et tes modifications sont publiées : tous ceux qui ont le code les voient.' : 'Les notes d\'Alicia sur les fiches et ses notes libres.') + '</p></div>';
    if (EDIT()) h += '<a class="btn label" href="#notes/n">Nouvelle note</a>';
    h += ks.length ? '<div style="border-top:1px solid var(--fg);margin-top:24px">' + ks.map(k => '<a class="cg-ref" href="' + lien(k) + '"><span class="n">' + esc(type(k).slice(0, 3)) + '</span><span><span class="t">' + esc(notes[k].titre || "Sans titre") + '</span><span class="s">' + esc(type(k)) + ' · ' + esc((notes[k].texte || "").slice(0, 90)) + '</span></span><span class="label muted">→</span></a>').join("") + '</div>' : '<div class="empty"><p>Aucune note pour l\'instant.</p></div>';
    h += '<section class="editrice"><h2 class="label">Mode éditrice</h2>' + (EDIT()
      ? '<p class="muted" style="margin:0">Activé sur cet appareil : tu peux écrire, modifier et supprimer, et tout est publié pour les autres.</p><label class="chip" style="margin:4px 0"><input type="checkbox" id="notes-pub"' + (notesPub ? ' checked' : '') + '><span>' + (notesPub ? 'Mes notes sont visibles par les autres' : 'Mes notes sont masquées pour les autres') + '</span></label><button type="button" class="label more" id="gh-off">Désactiver sur cet appareil</button>'
      : '<p class="muted" style="margin:0">Pour écrire et modifier le site, colle ta clé GitHub (à faire une fois par appareil).</p><input id="gh-tok" class="search" type="password" placeholder="github_pat_…" autocomplete="off"><button type="button" class="btn label" id="gh-on">Activer</button>') + '</section></div>';

        if (r.ok && j.permissions && j.permissions.push) { save("pressing:gh", tok); toast("Mode éditrice activé"); viewNotes([]); } else toast("Clé refusée : vérifie ses droits sur PRESS-ING");
      } catch (e) { toast("Vérification impossible, réessaie"); }
    };

  }

        const rs = chercherArticles(A, q), cs = rs.slice(0, 12);
        if (cs.length) h += '<div class="qs-grp label">Articles · ' + rs.length + ' résultat' + (rs.length > 1 ? 's' : '') + '</div>' + cs.map(r => { const c = r.a.c; return '<button type="button" class="qs-item" data-qs-go="' + esc(c.id) + '"><span><div class="t">' + esc(c.titre) + '</div><div class="sub">' + esc(NOM[c.matiere]) + ' · ' + esc(c.source) + ' · ' + esc(dShort(c.id.slice(0, 10))) + '</div></span><span class="label muted">→</span></button>'; }).join("");
      } else if (charge) h += '<p class="muted" style="padding:10px 0;margin:0">Recherche dans tous les articles…</p>';
      list.innerHTML = h || '<p class="muted" style="padding:14px 0;margin:0">Aucun résultat pour « ' + esc(q) + ' ».</p>';
    }
    render("");
    inp.focus();
    inp.addEventListener("input", () => {
      if (!A && !charge && inp.value.trim()) { charge = true; toutesActus().then(x => { A = x; charge = false; if (document.body.contains(inp)) render(inp.value); }).catch(() => { charge = false; }); }
      render(inp.value);
    });
    bg.addEventListener("click", e => {
      if (e.target === bg || e.target.closest("[data-qs-close]")) { qsClose(); return; }
      const g = e.target.closest("[data-qs-go]");
      if (g) { qsClose(); location.hash = g.dataset.qsGo; }
    });
  }
  const qsBtn = document.getElementById("qs-open");
  if (qsBtn) qsBtn.addEventListener("click", qsOpen);
  document.addEventListener("keydown", e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); qsOpen(); }
    else if (e.key === "Escape" && document.querySelector(".qs-bg")) { qsClose(); }
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(() => {}); });
  }

  window.addEventListener("hashchange", () => { qsClose(); route().then(() => { window.scrollTo(0, 0); updateProg(); }); });

  (async function start() {
    try {
      await loadModifs();
      const idx = await getJSON("data/index.json");
      state.index = idx.editions.slice().sort().reverse();
      state.date = state.index[0];
      await route();
      updateProg(); updateNL();
    } catch (e) {
      app.innerHTML = '<div class="empty narrow"><p>Pas encore d\'édition.</p><p class="muted">La première revue de presse arrive dès sa publication.</p></div>';
    }
  })();
})();
</script>
